{{ partial "partials/head.html" (merge (dict "Title" "搜索") .) }}
<main><div class="container">
  <h2 style="font-size:20px;">搜索: {{ .Q }}</h2>
  <form action="/search" method="get" style="margin-bottom:16px;">
    <input name="q" value="{{ .Q }}" placeholder="输入关键词（支持中文）" style="padding:8px;width:300px;">
    <button type="submit" style="padding:8px 16px;">搜索</button>
  </form>
  {{ range .Results }}
  <div class="card">
    <h3><a href="/node/{{ .Slug }}" style="color:#1e3a5f;">{{ .Fields.title }}</a></h3>
    <div class="meta">{{ datefmt .CreatedAt "2006-01-02" }}</div>
  </div>
  {{ else }}<p style="color:#9ca3af;">无结果（或输入为空）</p>{{ end }}
</div></main>
{{ partial "partials/footer.html" . }}
