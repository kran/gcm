# 示例站点类型定义: 内容↔专家↔任职 + 分类树（parent 引用）
types:
  category:
    url: /category/{slug}
    view: tree
    title: name
    icon: FolderOpened
    fields:
      - { name: name, kind: text, required: true, label: 名称 }
      - { name: parent, kind: ref, to: category, transitive: true, label: 父级}
  article:
    url: /article/{slug}
    search: true
    title: title
    icon: Document
    fields:
      - { name: title, kind: text, required: true, label: 标题 }
      - { name: body, kind: richtext, required: true, label: 正文 }
      - { name: cover, kind: upload-image, label: 封面 }
      - { name: accent, kind: color, label: 强调色 }
      - { name: authors, kind: "ref[]", to: person, label: 作者 }
      - { name: categories, kind: "ref[]", to: category, label: 分类 }
  person:
    url: /person/{slug}
    title: name
    icon: User
    fields:
      - { name: name, kind: text, required: true, label: 姓名 }
      - { name: bio, kind: textarea, label: 简介 }
      - { name: articles, kind: "ref[]", to: article, label: 文章 }
      - { name: employment, kind: "ref[]", to: employment, label: 任职 }
  org:
    title: name
    fields:
      - { name: name, kind: text, required: true, label: 名称 }
      - { name: brief, kind: textarea, label: 简介 }
      - { name: intro, kind: richtext, label: 详细介绍 }
      - { name: founded, kind: number, label: 成立年份 }
      - { name: active, kind: bool, label: 是否活跃 }
      - { name: logo, kind: upload-image, label: Logo }
      - { name: charter, kind: upload-file, label: 章程文件 }
      - { name: color, kind: color, label: 主色 }
      - { name: partner, kind: ref, to: org, label: 合作机构 }
      - { name: members, kind: "ref[]", to: person, label: 成员 }
      - { name: tags, kind: array, item: { kind: textarea }, label: 标签 }
      - { name: links, kind: array, item: { kind: object, fields:
            [ { name: label, kind: text }, { name: url, kind: text } ] }, label: 链接 }
      - { name: meta, kind: object, fields:
            [ { name: og_title, kind: textarea }, { name: og_desc, kind: textarea } ], label: SEO }
      - { name: scores, kind: array, item: { kind: number }, label: 评分 }
  employment:
    title: person.$.name
    fields:
      - { name: person, kind: ref, to: person, required: true }
      - { name: org, kind: ref, to: org, required: true }
      - { name: role, kind: text }
      - { name: tenure, kind: textarea }